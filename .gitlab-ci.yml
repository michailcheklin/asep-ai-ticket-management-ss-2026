image: python:3.11

stages:
  - prepare_downloads_for_tests
  - before_deepeval
  - deepeval

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  VENV_DIR: "$CI_PROJECT_DIR/venv"
  HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"

download_python_dependencies:
  stage:
    prepare_downloads_for_tests
  script:
    - python --version
    - pip install --upgrade pip
    - python -m venv $VENV_DIR
    - source $VENV_DIR/bin/activate
    - if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      paths:
        - $PIP_CACHE_DIR
        - $VENV_DIR/lib/python*/site-packages/
      policy: push
  # Redownload for the python dependency cache only if the requirements.txt file was changed
  rules:
    - changes:
        paths:
          - tests/requirements.txt
  tags:
    - dind
    - ude-sse

download_hugging_face_models:
  stage:
    prepare_downloads_for_tests
  script:
    - python --version
    - pip install --upgrade pip
    - python -m venv $VENV_DIR
    - source $VENV_DIR/bin/activate
    - if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
    - python ./backend/prompt_security/prompt_check_model_setup.py
    - PYTHONPATH=. python -c "import backend.rag.retrieve_info"
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      paths:
        - $PIP_CACHE_DIR
        - $VENV_DIR/lib/python*/site-packages/
      policy: pull
    - key: hf-models
      paths:
        - $HF_HOME
      policy: push
  # Redownload the Hugging Face models for the prompt security check or the
  # RAG retrieval models only if their respective setup/module file changed,
  # e. g. to choose a different model
  rules:
    - changes:
        paths:
          - backend/prompt_security/prompt_check_model_setup.py
          - backend/rag/retrieve_info.py
  tags:
    - dind
    - ude-sse

run_test_ticket_escalation:
  stage: before_deepeval
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      paths:
        - $PIP_CACHE_DIR
        - $VENV_DIR/lib/python*/site-packages/
      policy: pull
    - key: hf-models
      paths:
        - $HF_HOME
      policy: pull

  tags:
    - dind
    - ude-sse
  script:
    - export HF_HOME=$HF_HOME
    - python --version
    - pip install --upgrade pip
    - python -m venv $VENV_DIR
    - source $VENV_DIR/bin/activate
    - if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
    - echo "AGENT=ZIM" >> .env
    - pytest ./backend/tests/test_incident_escalation.py -s -v

run_test_prompt_security:
  stage: before_deepeval
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      paths:
        - $PIP_CACHE_DIR
        - $VENV_DIR/lib/python*/site-packages/
      policy: pull
    - key: hf-models
      paths:
        - $HF_HOME
      policy: pull
  tags:
    - dind
    - ude-sse
  script:
    - export HF_HOME=$HF_HOME
    - python --version
    - pip install --upgrade pip
    - python -m venv $VENV_DIR
    - source $VENV_DIR/bin/activate
    - if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
    - pytest ./tests/test_prompt_security_result.py -v -s


run_test_chat_endpoint_connectivity:
  stage: before_deepeval
  tags:
    - dind
    - ude-sse
  # Caching the Python dependencies per branch, or otherwise
  # adding dependencies in one branch that cause a conflict
  # would cause conflicts in all other branches
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      paths:
        - $PIP_CACHE_DIR
        - $VENV_DIR/lib/python*/site-packages/
      policy: pull
    - key: hf-models
      paths:
        - .cache/huggingface/
      policy: pull
  script:
    - python --version
    - pip install --upgrade pip
    - python -m venv $VENV_DIR
    - source $VENV_DIR/bin/activate
    - if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
    - echo "LANGSMITH_TRACING=true" >> .env
    - echo "LANGSMITH_API_KEY=$LANGSMITH_API_KEY" >> .env
    - echo "LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com" >> .env
    - echo "SAIA_API_KEY=$SAIA_API_KEY" >> .env
    - echo "USE_SAIA_API=true" >> .env
    - echo "ZAMMAD_SERVER_ADDRESS=$ZAMMAD_SERVER_ADDRESS" >> .env
    - echo "AGENT=ZIM" >> .env
    - pytest ./tests/test_chat_endpoint_connectivity.py -v -s

