image: python:3.11

stages:
  - test_prompt_security
  - test_chat_endpoint_connectivity

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  VENV_DIR: "$CI_PROJECT_DIR/venv"

# Caching the Python dependencies per branch, or otherwise
# adding dependencies in one branch that cause a conflict
# would cause conflicts in all other branches
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version
  - python -m venv $VENV_DIR
  - source $VENV_DIR/bin/activate
  - pip install --upgrade pip
  - if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi

run_test_prompt_security:
  stage: test_prompt_security
  tags:
    - dind
    - ude-sse
  script:
    - pytest ./tests/test_prompt_security_result.py -v -s

run_test_chat_endpoint_connectivity:
  stage: test_chat_endpoint_connectivity
  tags:
    - dind
    - ude-sse
  before_script:
    - echo "LANGSMITH_TRACING=true" >> .env
    - echo "LANGSMITH_API_KEY=$LANGSMITH_API_KEY" >> .env
    - echo "LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com" >> .env
    - echo "SAIA_API_KEY=$SAIA_API_KEY" >> .env
    - echo "USE_SAIA_API=true" >> .env
    - echo "ZAMMAD_SERVER_ADDRESS=$ZAMMAD_SERVER_ADDRESS" >> .env
  script:
    - pytest ./tests/test_chat_endpoint_connectivity.py -v -s