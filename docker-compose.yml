# AI Ticket Management App + offizieller Zammad-Stack
---
x-shared:
  zammad-service: &zammad-service
    image: ${IMAGE_REPO:-ghcr.io/zammad/zammad}:${VERSION:-7.0.1-0035}
    restart: ${RESTART:-always}
    environment: &zammad-environment
      MEMCACHE_SERVERS: ${MEMCACHE_SERVERS:-zammad-memcached:11211}
      POSTGRESQL_DB: ${POSTGRES_DB:-zammad_production}
      POSTGRESQL_HOST: ${POSTGRES_HOST:-zammad-postgresql}
      POSTGRESQL_USER: ${POSTGRES_USER:-zammad}
      POSTGRESQL_PASS: ${POSTGRES_PASS:-zammad}
      POSTGRESQL_PORT: ${POSTGRES_PORT:-5432}
      POSTGRESQL_OPTIONS: ${POSTGRESQL_OPTIONS:-?pool=50}
      POSTGRESQL_DB_CREATE: ""
      REDIS_URL: ${REDIS_URL:-redis://zammad-redis:6379}
      REDIS_SENTINELS: ""
      REDIS_SENTINEL_NAME: ""
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      REDIS_SENTINEL_USERNAME: ""
      REDIS_SENTINEL_PASSWORD: ""
      S3_URL: ""
      BACKUP_DIR: ${BACKUP_DIR:-/var/tmp/zammad}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      HOLD_DAYS: ${HOLD_DAYS:-10}
      TZ: ${TZ:-Europe/Berlin}
      AUTOWIZARD_JSON: ""
      AUTOWIZARD_RELATIVE_PATH: ""
      #Ich habe Elastic search deaktiviert
      ELASTICSEARCH_ENABLED: false
      ELASTICSEARCH_SCHEMA:
      ELASTICSEARCH_HOST:
      ELASTICSEARCH_PORT:
      ELASTICSEARCH_USER: ""
      ELASTICSEARCH_PASS: ""
      ELASTICSEARCH_NAMESPACE: ""
      ELASTICSEARCH_REINDEX: ""
      NGINX_PORT: ${NGINX_PORT:-8080}
      NGINX_CLIENT_MAX_BODY_SIZE: ""
      NGINX_SERVER_NAME: ""
      NGINX_SERVER_SCHEME: ""
      RAILS_TRUSTED_PROXIES: ""
      ZAMMAD_HTTP_TYPE: ${ZAMMAD_HTTP_TYPE:-http}
      ZAMMAD_FQDN: ${ZAMMAD_FQDN:-localhost}
      ZAMMAD_WEB_CONCURRENCY: ""
      ZAMMAD_MANAGE_SESSIONS_JOBS_WORKERS: ""
      ZAMMAD_PROCESS_SESSIONS_JOBS_WORKERS: ""
      ZAMMAD_PROCESS_SCHEDULED_JOBS_WORKERS: ""
      ZAMMAD_PROCESS_DELAYED_JOBS_WORKERS: ""
      ZAMMAD_PROCESS_DELAYED_JOBS_WORKER_THREADS: ""
      ZAMMAD_PROCESS_DELAYED_AI_JOBS_WORKERS: ""
      ZAMMAD_PROCESS_DELAYED_AI_JOBS_WORKER_THREADS: ""
      ZAMMAD_PROCESS_DELAYED_COMMUNICATION_INBOUND_JOBS_WORKERS: ""
      ZAMMAD_PROCESS_DELAYED_COMMUNICATION_INBOUND_JOBS_WORKER_THREADS: ""
      ZAMMAD_OTRS_IMPORT_READ_TIMEOUT: ""
      ZAMMAD_OTRS_IMPORT_TOTAL_TIMEOUT: ""
      ZAMMAD_SESSION_JOBS_CONCURRENT: ""
      VIRTUAL_HOST: ""
      VIRTUAL_PORT: ""
      LETSENCRYPT_HOST: ""
      LETSENCRYPT_EMAIL: ""
    volumes:
      - zammad-backup:/var/tmp/zammad:ro
      - zammad-storage:/opt/zammad/storage
    depends_on:
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis

services:
  backend_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ZAMMAD_INTERNAL_URL: http://zammad-nginx:${NGINX_PORT:-8080}
      ZAMMAD_API_TOKEN: ${ZAMMAD_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      zammad-nginx:
        condition: service_started

  frontend_app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend_app:8000
      ZAMMAD_UI_URL: http://localhost:${NGINX_EXPOSE_PORT:-8080}
    depends_on:
      backend_app:
        condition: service_healthy

  zammad-backup:
    <<: *zammad-service
    command: ["zammad-backup"]
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage
    user: "0:0"

  zammad-elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-9.4.0}
    restart: ${RESTART:-always}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}

  zammad-init:
    <<: *zammad-service
    command: ["zammad-init"]
    depends_on:
      - zammad-postgresql
      - zammad-elasticsearch
    restart: on-failure
    user: "0:0"

  zammad-memcached:
    command: memcached -m 256M
    image: memcached:${MEMCACHE_VERSION:-1.6.41-alpine}
    restart: ${RESTART:-always}

  zammad-nginx:
    <<: *zammad-service
    command: ["zammad-nginx"]
    expose:
      - "${NGINX_PORT:-8080}"
    ports:
      - "${NGINX_EXPOSE_PORT:-8080}:${NGINX_PORT:-8080}"
    depends_on:
      - zammad-railsserver

  zammad-postgresql:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zammad_production}
      POSTGRES_USER: ${POSTGRES_USER:-zammad}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-zammad}
    image: postgres:${POSTGRES_VERSION:-17.9-alpine}
    restart: ${RESTART:-always}
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  zammad-railsserver:
    <<: *zammad-service
    command: ["zammad-railsserver"]

  zammad-redis:
    image: redis:${REDIS_VERSION:-8.6.3-alpine}
    restart: ${RESTART:-always}
    volumes:
      - redis-data:/data

  zammad-scheduler:
    <<: *zammad-service
    command: ["zammad-scheduler"]

  zammad-websocket:
    <<: *zammad-service
    command: ["zammad-websocket"]

volumes:
  elasticsearch-data:
    driver: local
  postgresql-data:
    driver: local
  redis-data:
    driver: local
  zammad-backup:
    driver: local
  zammad-storage:
    driver: local
